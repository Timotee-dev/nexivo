{% extends "base.html" %}
{% block title %}Browse Events{% endblock %}
{% block content %}

<!-- Filter Bar -->
<div class="filter-bar">
  <div class="filter-bar__inner">
    <input type="text" id="search-input" class="form-input" placeholder="Search events…"
      style="max-width:260px;padding:7px 14px;font-size:.875rem;background:var(--surface-2);border-color:var(--border)">
    <span class="filter-chip filter-chip--active" data-type="">All</span>
    <span class="filter-chip" data-type="physical">In-Person</span>
    <span class="filter-chip" data-type="virtual">Virtual</span>
    <span class="filter-chip" data-type="hybrid">Hybrid</span>
    <span id="filter-count" style="margin-left:auto;font-size:.8125rem;color:var(--text-mute)"></span>
  </div>
</div>

<div class="container">
  <div class="evlist-layout">

    <!-- Sidebar Filters -->
    <div class="evlist-sidebar">
      <div class="evlist-filter-card">

        <p class="evlist-filter-title" style="margin-top:0">Category</p>
        <div id="cat-filter-list" class="filter-radio-group">
          <label class="filter-radio-item">
            <input type="radio" name="cat" value="" checked style="accent-color:var(--gold)"> All Categories
          </label>
        </div>

        <p class="evlist-filter-title">Event Type</p>
        <div class="filter-radio-group">
          <label class="filter-radio-item"><input type="radio" name="etype" value="" checked style="accent-color:var(--gold)"> All Types</label>
          <label class="filter-radio-item"><input type="radio" name="etype" value="physical" style="accent-color:var(--gold)"> 📍 In-Person</label>
          <label class="filter-radio-item"><input type="radio" name="etype" value="virtual" style="accent-color:var(--gold)"> 💻 Virtual</label>
          <label class="filter-radio-item"><input type="radio" name="etype" value="hybrid" style="accent-color:var(--gold)"> 🌐 Hybrid</label>
        </div>

        <p class="evlist-filter-title">Date Range</p>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div>
            <label class="form-label" style="font-size:.75rem;margin-bottom:4px;display:block">From</label>
            <input type="date" id="date-from" class="form-input" style="font-size:.875rem;padding:8px 12px">
          </div>
          <div>
            <label class="form-label" style="font-size:.75rem;margin-bottom:4px;display:block">To</label>
            <input type="date" id="date-to" class="form-input" style="font-size:.875rem;padding:8px 12px">
          </div>
          <button class="btn btn--outline btn--sm btn--full" onclick="applyDateFilter()">Apply Filter</button>
        </div>

        <p class="evlist-filter-title">Price</p>
        <div class="filter-radio-group">
          <label class="filter-radio-item"><input type="radio" name="price" value="" checked style="accent-color:var(--gold)"> Any Price</label>
          <label class="filter-radio-item"><input type="radio" name="price" value="free" style="accent-color:var(--gold)"> 🎉 Free Events</label>
          <label class="filter-radio-item"><input type="radio" name="price" value="paid" style="accent-color:var(--gold)"> 🎫 Paid Events</label>
        </div>

        <button class="btn btn--outline btn--sm btn--full" onclick="clearFilters()" style="margin-top:20px;opacity:.7">
          Clear All Filters
        </button>
      </div>
    </div>

    <!-- Results -->
    <div>
      <div id="events-grid" class="ev-grid"></div>

      <div id="events-empty" class="hidden">
        <div class="empty-state">
          <span class="empty-state__icon">🔍</span>
          <h3>No events found</h3>
          <p>Try adjusting your filters or search terms</p>
          <a href="/events/" class="btn btn--outline btn--sm" style="margin-top:16px">Clear Filters</a>
        </div>
      </div>

      <div id="pagination" class="pagination"></div>
    </div>

  </div>
</div>

<script src="/static/js/events.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  // Populate category filter from API
  try {
    const cats = await Api.get('/events/categories/', true);
    const list = document.getElementById('cat-filter-list');
    if (cats && cats.results) {
      cats.results.forEach(c => {
        const lbl = document.createElement('label');
        lbl.className = 'filter-radio-item';
        lbl.innerHTML = `<input type="radio" name="cat" value="${escapeHtml(c.slug)}" style="accent-color:var(--gold)"> ${escapeHtml(c.name)}`;
        list.appendChild(lbl);
      });
    }
  } catch(e) {}

  // Sync type chips with sidebar radio
  document.querySelectorAll('.filter-chip[data-type]').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('filter-chip--active'));
      chip.classList.add('filter-chip--active');
      const t = chip.dataset.type;
      const radio = document.querySelector(`input[name="etype"][value="${t}"]`);
      if (radio) radio.checked = true;
      applyFiltersFromSidebar();
    });
  });

  // Sidebar radio change
  document.querySelectorAll('input[name="etype"]').forEach(r => {
    r.addEventListener('change', () => {
      const v = r.value;
      document.querySelectorAll('.filter-chip').forEach(c => {
        c.classList.toggle('filter-chip--active', c.dataset.type === v);
      });
      applyFiltersFromSidebar();
    });
  });

  document.querySelectorAll('input[name="cat"], input[name="price"]').forEach(r => {
    r.addEventListener('change', applyFiltersFromSidebar);
  });

  function applyFiltersFromSidebar() {
    const url = new URL(window.location.href);
    const cat = document.querySelector('input[name="cat"]:checked')?.value || '';
    const etype = document.querySelector('input[name="etype"]:checked')?.value || '';
    const price = document.querySelector('input[name="price"]:checked')?.value || '';
    if (cat) url.searchParams.set('category', cat); else url.searchParams.delete('category');
    if (etype) url.searchParams.set('event_type', etype); else url.searchParams.delete('event_type');
    if (price) url.searchParams.set('price_range', price); else url.searchParams.delete('price_range');
    url.searchParams.delete('page');
    window.location.href = url.toString();
  }

  // Apply pre-selected filters from URL
  const params = new URLSearchParams(window.location.search);
  const selType = params.get('event_type') || '';
  const selCat  = params.get('category') || '';
  const selPrice = params.get('price_range') || '';
  if (selType) {
    const r = document.querySelector(`input[name="etype"][value="${selType}"]`);
    if (r) r.checked = true;
    document.querySelectorAll('.filter-chip').forEach(c =>
      c.classList.toggle('filter-chip--active', c.dataset.type === selType)
    );
  }
  if (selCat) {
    const r = document.querySelector(`input[name="cat"][value="${selCat}"]`);
    if (r) r.checked = true;
  }
  if (selPrice) {
    const r = document.querySelector(`input[name="price"][value="${selPrice}"]`);
    if (r) r.checked = true;
  }
});

function applyDateFilter() {
  const from = document.getElementById('date-from').value;
  const to   = document.getElementById('date-to').value;
  const url = new URL(window.location.href);
  if (from) url.searchParams.set('start_after', from);   else url.searchParams.delete('start_after');
  if (to)   url.searchParams.set('start_before', to);    else url.searchParams.delete('start_before');
  url.searchParams.delete('page');
  window.location.href = url.toString();
}
window.applyDateFilter = applyDateFilter;

function clearFilters() {
  window.location.href = '/events/';
}
window.clearFilters = clearFilters;

function escapeHtml(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
{% endblock %}
