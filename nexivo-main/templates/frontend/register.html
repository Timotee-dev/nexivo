{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card" style="max-width:520px">
    <div class="auth-card__logo">Nexiv<span>o</span></div>
    <h1 class="auth-card__title">Create your account</h1>
    <p class="auth-card__sub">Join thousands discovering Nigeria's best events</p>
    <form id="register-form">
      <div class="grid-2" style="gap:16px">
        <div class="form-group"><label class="form-label">First Name</label><input class="form-input" id="first_name" name="first_name" required></div>
        <div class="form-group"><label class="form-label">Last Name</label><input class="form-input" id="last_name" name="last_name" required></div>
      </div>
      <div class="form-group"><label class="form-label">Email Address</label><input class="form-input" type="email" id="email" name="email" autocomplete="email" required></div>
      <div class="form-group"><label class="form-label">Phone Number <span class="text-muted">(optional)</span></label><input class="form-input" type="tel" id="phone_number" name="phone_number" placeholder="+2348012345678"></div>
      <div class="form-group">
        <label class="form-label">I want to</label>
        <select class="form-select" id="role" name="role">
          <option value="customer">Attend events</option>
          <option value="host">Host events</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Password</label><input class="form-input" type="password" id="password" name="password" autocomplete="new-password" required></div>
      <div class="form-group"><label class="form-label">Confirm Password</label><input class="form-input" type="password" id="password_confirm" name="password_confirm" autocomplete="new-password" required></div>
      <button class="btn btn--primary btn--full" type="submit">Create Account</button>
    </form>
    <p class="text-center text-muted mt-16" style="font-size:.875rem">Already have an account? <a href="/auth/login/" class="text-gold fw-600">Sign in</a></p>
    <p class="text-center text-muted mt-8" style="font-size:.75rem">By creating an account you agree to our <a href="/terms/">Terms</a> and <a href="/privacy/">Privacy Policy</a>.</p>
  </div>
</div>
<script src="/static/js/auth.js"></script>
{% endblock %}
