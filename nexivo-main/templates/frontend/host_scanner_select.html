{% extends "base.html" %}
{% block title %}QR Scanner{% endblock %}
{% block content %}
<div class="dashboard">
  {% include "frontend/_host_sidebar.html" with active="scanner" %}
  <main class="dashboard__main">
    <div style="margin-bottom:28px">
      <h1 class="font-display" style="font-size:1.75rem">QR Scanner</h1>
      <p class="text-muted">Select an event to open its check-in scanner</p>
    </div>

    <div class="grid-3" id="scanner-events-grid">
      <div style="grid-column:1/-1;text-align:center;padding:40px">
        <div class="spinner" style="margin:0 auto"></div>
      </div>
    </div>
  </main>
</div>
<script src="/static/js/dashboard.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  Auth.requireAuth();
  const grid = document.getElementById('scanner-events-grid');
  try {
    const data = await Api.get('/events/mine/?status=published');
    if (!data.results?.length) {
      grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:56px 20px;background:var(--surface);border-radius:var(--radius-lg)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:48px;height:48px;margin:0 auto 16px;display:block;opacity:.3"><polyline points="23 7 23 1 17 1"/><line x1="16" y1="8" x2="23" y2="1"/><polyline points="1 17 1 23 7 23"/><line x1="8" y1="16" x2="1" y2="23"/></svg>
        <h3 style="font-weight:700;margin-bottom:6px">No published events</h3>
        <p class="text-muted" style="margin-bottom:16px">Publish an event to use the QR scanner</p>
        <a href="/events/create/" class="btn btn--gold">Create an Event</a>
      </div>`;
      return;
    }
    grid.innerHTML = data.results.map(e => `
      <a href="/dashboard/scanner/${e.id}/" class="card" style="display:block;text-decoration:none">
        <div class="card__body">
          <h3 class="card__title" style="margin-bottom:8px">${e.title}</h3>
          <p class="text-muted" style="font-size:.875rem">${new Date(e.start_datetime).toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'})}</p>
          <div class="flex-between mt-16">
            <span class="badge badge--green">Published</span>
            <span class="badge badge--gold">${e.tickets_sold_count} sold</span>
          </div>
        </div>
        <div class="card__footer">
          <span class="btn btn--gold btn--sm" style="width:100%;justify-content:center">Open Scanner →</span>
        </div>
      </a>`).join('');
  } catch { Toast.error('Failed to load events.'); }
});
</script>
{% endblock %}
