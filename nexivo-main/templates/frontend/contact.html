{% extends "base.html" %}
{% block title %}Contact Us{% endblock %}
{% block content %}
<div style="max-width:600px;margin:0 auto;padding:48px 20px">
  <h1 class="font-display" style="font-size:2rem;font-weight:800;margin-bottom:8px">Contact Us</h1>
  <p class="text-muted" style="margin-bottom:40px">We typically respond within 24 hours</p>

  <div class="chart-card" style="margin-bottom:24px">
    <h2 style="font-size:1rem;font-weight:700;margin-bottom:20px;color:var(--text-sub);text-transform:uppercase;letter-spacing:.06em;font-size:.75rem">Reach us at</h2>
    <div style="display:flex;flex-direction:column;gap:20px">
      <div style="display:flex;align-items:center;gap:16px">
        <div style="width:40px;height:40px;border-radius:10px;background:rgba(212,175,70,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.5" style="width:18px;height:18px"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </div>
        <div>
          <p style="font-weight:600;margin-bottom:2px">Email</p>
          <a href="mailto:teetimo29@gmail.com" class="text-gold">teetimo29@gmail.com</a>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        <div style="width:40px;height:40px;border-radius:10px;background:rgba(212,175,70,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.5" style="width:18px;height:18px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <div>
          <p style="font-weight:600;margin-bottom:2px">WhatsApp</p>
          <a href="https://wa.me/2347072240810" class="text-gold" target="_blank">+234 707 224 0810</a>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        <div style="width:40px;height:40px;border-radius:10px;background:rgba(212,175,70,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.5" style="width:18px;height:18px"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/></svg>
        </div>
        <div>
          <p style="font-weight:600;margin-bottom:2px">Twitter/X</p>
          <a href="https://twitter.com/nexivo_ng" class="text-gold" target="_blank">@nexivo_ng</a>
        </div>
      </div>
    </div>
  </div>

  <div class="chart-card">
    <h2 style="font-size:1.125rem;font-weight:700;margin-bottom:20px">Send us a message</h2>
    <div id="contact-form">
      <div class="form-group" style="margin-bottom:16px">
        <label class="form-label">Your Name</label>
        <input class="form-input" id="cf-name" type="text" placeholder="Timothy Arifalo">
      </div>
      <div class="form-group" style="margin-bottom:16px">
        <label class="form-label">Email Address</label>
        <input class="form-input" id="cf-email" type="email" placeholder="you@example.com">
      </div>
      <div class="form-group" style="margin-bottom:16px">
        <label class="form-label">Subject</label>
        <input class="form-input" id="cf-subject" type="text" placeholder="How can we help?">
      </div>
      <div class="form-group" style="margin-bottom:20px">
        <label class="form-label">Message</label>
        <textarea class="form-input" id="cf-message" rows="5" placeholder="Describe your issue or question..."></textarea>
      </div>
      <button class="btn btn--gold btn--full" onclick="submitContact()">Send Message</button>
      <p id="cf-status" style="margin-top:12px;text-align:center;display:none"></p>
    </div>
  </div>
</div>
<script>
function submitContact() {
  const name = document.getElementById('cf-name').value.trim();
  const email = document.getElementById('cf-email').value.trim();
  const subject = document.getElementById('cf-subject').value.trim();
  const message = document.getElementById('cf-message').value.trim();
  const status = document.getElementById('cf-status');
  if (!name || !email || !message) { Toast.error('Please fill in all required fields.'); return; }
  // Send via mailto as simple fallback
  window.location.href = `mailto:teetimo29@gmail.com?subject=${encodeURIComponent(subject || 'Support Request')}&body=${encodeURIComponent(`Name: ${name}\nEmail: ${email}\n\n${message}`)}`;
  status.style.display = '';
  status.style.color = 'var(--success)';
  status.textContent = '✅ Opening your email client...';
}
</script>
{% endblock %}
