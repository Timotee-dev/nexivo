{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="dashboard">
  {% include "frontend/_host_sidebar.html" with active="profile" %}
  <main class="dashboard__main">
    <div style="margin-bottom:28px">
      <h1 class="font-display" style="font-size:1.75rem">My Profile</h1>
      <p class="text-muted">Manage your personal and business details</p>
    </div>
    <div style="max-width:560px">
      <div class="chart-card">
        <h2 style="font-size:1.125rem;font-weight:600;margin-bottom:20px">Personal Information</h2>
        <div class="form-group"><label class="form-label">First Name</label><input class="form-input" id="p-first" placeholder="First name"></div>
        <div class="form-group"><label class="form-label">Last Name</label><input class="form-input" id="p-last" placeholder="Last name"></div>
        <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="p-email" disabled style="opacity:.6"></div>
        <div class="form-group"><label class="form-label">Phone Number</label><input class="form-input" id="p-phone" placeholder="+2348012345678"></div>
        <div class="form-group"><label class="form-label">Bio</label><textarea class="form-textarea" id="p-bio" placeholder="Tell attendees about yourself or your organisation…" style="min-height:100px"></textarea></div>
        <button class="btn btn--primary" onclick="saveProfile()">Save Changes</button>
      </div>

      <div class="chart-card mt-24">
        <h2 style="font-size:1.125rem;font-weight:600;margin-bottom:20px">Business Details</h2>
        <div class="form-group"><label class="form-label">Business / Organisation Name</label><input class="form-input" id="hp-biz-name" placeholder="Your event company or organisation"></div>
        <div class="form-group"><label class="form-label">Business Description</label><textarea class="form-textarea" id="hp-biz-desc" style="min-height:80px"></textarea></div>
        <button class="btn btn--outline" onclick="saveHostProfile()">Save Business Details</button>
      </div>

      <div class="chart-card mt-24">
        <h2 style="font-size:1.125rem;font-weight:600;margin-bottom:16px">Change Password</h2>
        <div class="form-group"><label class="form-label">Current Password</label><input class="form-input" type="password" id="pw-old"></div>
        <div class="form-group"><label class="form-label">New Password</label><input class="form-input" type="password" id="pw-new"></div>
        <button class="btn btn--outline" onclick="changePassword()">Update Password</button>
      </div>
    </div>
  </main>
</div>
<script src="/static/js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  Auth.requireAuth();
  try {
    const [me, hp] = await Promise.all([
      Api.get('/auth/me/'),
      Api.get('/auth/host-profile/'),
    ]);
    document.getElementById('p-first').value = me.first_name || '';
    document.getElementById('p-last').value = me.last_name || '';
    document.getElementById('p-email').value = me.email || '';
    document.getElementById('p-phone').value = me.phone_number || '';
    document.getElementById('p-bio').value = me.bio || '';
    document.getElementById('hp-biz-name').value = hp.business_name || '';
    document.getElementById('hp-biz-desc').value = hp.business_description || '';
  } catch {}
});

async function saveProfile() {
  try {
    await Api.patch('/auth/me/', {
      first_name: document.getElementById('p-first').value,
      last_name: document.getElementById('p-last').value,
      phone_number: document.getElementById('p-phone').value,
      bio: document.getElementById('p-bio').value,
    });
    Toast.success('Profile updated.');
  } catch(err) { Toast.error(err?.detail || 'Failed to save.'); }
}

async function saveHostProfile() {
  try {
    await Api.patch('/auth/host-profile/', {
      business_name: document.getElementById('hp-biz-name').value,
      business_description: document.getElementById('hp-biz-desc').value,
    });
    Toast.success('Business details updated.');
  } catch(err) { Toast.error(err?.detail || 'Failed to save.'); }
}

async function changePassword() {
  try {
    await Api.post('/auth/change-password/', {
      old_password: document.getElementById('pw-old').value,
      new_password: document.getElementById('pw-new').value,
    });
    Toast.success('Password updated.');
    document.getElementById('pw-old').value = '';
    document.getElementById('pw-new').value = '';
  } catch(err) { Toast.error(err?.errors?.old_password?.[0] || err?.detail || 'Failed.'); }
}
</script>
{% endblock %}
