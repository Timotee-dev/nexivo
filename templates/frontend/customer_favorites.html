{% extends "base.html" %}
{% block title %}Saved Events{% endblock %}
{% block content %}
<div class="dashboard">
  {% include "frontend/_customer_sidebar.html" with active="favorites" %}
  <main class="dashboard__main">
    <h1 class="font-display" style="font-size:1.75rem;margin-bottom:28px">Saved Events</h1>
    <div class="grid-3" id="favorites-grid"><div class="spinner" style="margin:40px auto"></div></div>
  </main>
</div>
<script src="/static/js/events.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  Auth.requireAuth();
  const grid = document.getElementById('favorites-grid');
  try {
    const me = await Api.get('/auth/me/');
    // Favorites are stored on the CustomerProfile — fetch published events and cross-reference
    // via the is_favorited flag returned in EventDetailSerializer
    const data = await Api.get('/events/?page_size=100');
    const favorites = data.results.filter(e => e.is_favorited);
    if (!favorites.length) {
      grid.innerHTML = '<p class="text-muted" style="grid-column:1/-1">No saved events. Browse events and tap 🤍 to save them here.</p>';
      return;
    }
    grid.innerHTML = favorites.map(e => `
      <a href="/events/${e.slug}/" class="card" style="display:block">
        <div class="card__media"><img src="${e.banner_image || '/static/img/event-placeholder.svg'}" loading="lazy"></div>
        <div class="card__body">
          <h3 class="card__title">${e.title}</h3>
          <div class="card__meta"><span>📅 ${new Date(e.start_datetime).toLocaleDateString()}</span>${e.city ? `<span>📍 ${e.city}</span>` : ''}</div>
        </div>
      </a>`).join('');
  } catch { Toast.error('Failed to load saved events.'); }
});
</script>
{% endblock %}
