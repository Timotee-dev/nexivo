{% extends "base.html" %}
{% block title %}My Tickets{% endblock %}
{% block content %}

<div style="max-width:680px;margin:0 auto;padding:24px 16px">
  <h1 style="font-size:1.5rem;font-weight:800;margin-bottom:4px">My Tickets</h1>
  <p style="color:var(--muted);margin-bottom:24px;font-size:.9375rem">Your upcoming and past event tickets</p>
  <div id="my-tickets"><div class="spinner" style="margin:40px auto"></div></div>
</div>

<!-- QR Modal -->
<div class="modal-backdrop" id="qr-modal">
  <div class="modal" style="position:relative;text-align:center;max-width:340px">
    <button class="modal__close" onclick="Modal.close('qr-modal')">×</button>
    <h2 class="modal__title" id="qr-modal-title">Your Ticket</h2>
    <p style="color:var(--muted);font-size:.8125rem;font-family:monospace;margin-bottom:16px" id="qr-modal-code"></p>
    <img id="qr-modal-img" style="width:200px;height:auto;margin:0 auto;display:block;border-radius:8px">
    <p style="color:var(--muted);font-size:.8125rem;margin-top:12px">Show this at the entrance</p>
    <a id="qr-modal-download" href="#" download class="btn btn--gold" style="margin-top:14px;display:inline-flex">
      ⬇ Download QR Code
    </a>
  </div>
</div>

<!-- Transfer Modal -->
<div class="modal-backdrop" id="transfer-modal">
  <div class="modal" style="position:relative">
    <button class="modal__close" onclick="Modal.close('transfer-modal')">×</button>
    <h2 class="modal__title">Transfer Ticket</h2>
    <p class="modal__sub">Send this ticket to someone else. They have 48 hours to accept.</p>
    <input type="hidden" id="transfer-ticket-code">
    <div class="form-group">
      <label class="form-label">Recipient Email *</label>
      <input class="form-input" type="email" id="transfer-to-email" placeholder="friend@example.com">
    </div>
    <div class="form-group">
      <label class="form-label">Message (optional)</label>
      <input class="form-input" id="transfer-message" placeholder="Enjoy the show!">
    </div>
    <button class="btn btn--primary btn--full" onclick="submitTransfer()">Send Ticket</button>
  </div>
</div>

<script src="/static/js/nexivo.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  Auth.requireAuth();
  await loadTickets();
});

async function loadTickets() {
  const el = document.getElementById('my-tickets');

  try {
    const data = await Api.get('/tickets/mine/');
    const tickets = data.results || [];

    if (!tickets.length) {
      el.innerHTML = `
        <div style="text-align:center;padding:48px 20px">
          <div style="font-size:3rem;margin-bottom:12px">🎫</div>
          <h3 style="font-size:1.125rem;font-weight:700;margin-bottom:6px">No tickets yet</h3>
          <p style="color:var(--muted);margin-bottom:20px">Book an event to get your first ticket</p>
          <a href="/events/" class="btn btn--gold">Browse Events</a>
        </div>`;
      return;
    }

    el.innerHTML = tickets.map(t => {
      const eventTitle = t.event_title || t.event?.title || 'Event';
      const ticketTypeName = t.ticket_type_name || t.ticket_type?.name || '';
      const isUsed = t.status === 'used';
      const isValid = t.status === 'valid' || (!isUsed && t.status !== 'cancelled');
      const qrUrl = t.qr_image || '';

      return `
      <div style="
        background:var(--bg);
        border:2px ${isUsed ? 'solid var(--border)' : 'dashed var(--gold)'};
        border-radius:var(--radius-lg);
        padding:20px;
        margin-bottom:16px;
        opacity:${isUsed ? '.6' : '1'}
      ">
        <!-- Event title and status -->
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px">
          <h3 style="font-size:1rem;font-weight:700;line-height:1.3;flex:1">${eventTitle}</h3>
          <span style="
            padding:3px 10px;border-radius:40px;font-size:.75rem;font-weight:600;white-space:nowrap;flex-shrink:0;
            background:${isUsed ? 'var(--surface-2)' : '#e8f5e9'};
            color:${isUsed ? 'var(--muted)' : 'var(--success)'}
          ">${isUsed ? 'Used' : 'Valid'}</span>
        </div>

        <!-- Ticket type -->
        <p style="color:var(--muted);font-size:.875rem;margin-bottom:8px">${ticketTypeName}</p>

        <!-- Ticket code -->
        <div style="background:var(--surface-2);border-radius:6px;padding:8px 12px;margin-bottom:14px;font-family:monospace;font-size:.8125rem;word-break:break-all">
          ${t.ticket_code}
        </div>

        <!-- QR Image -->
        ${qrUrl ? `
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;cursor:pointer" onclick="showQR('${t.ticket_code}', '${qrUrl}', '${eventTitle.replace(/'/g, "\\'")}')">
          <img src="${qrUrl}" alt="QR Code"
               style="width:80px;height:80px;border-radius:8px;border:2px solid var(--border);flex-shrink:0"
               onerror="this.parentElement.style.display='none'">
          <div>
            <p style="font-weight:600;font-size:.875rem;margin-bottom:2px">📱 Tap to show QR code</p>
            <p style="color:var(--muted);font-size:.8125rem">Show at the entrance for check-in</p>
          </div>
        </div>` : `
        <div style="background:var(--surface-2);border-radius:8px;padding:14px;margin-bottom:14px;text-align:center;color:var(--muted);font-size:.875rem">
          QR code generating…
        </div>`}

        <!-- Action buttons -->
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${qrUrl ? `
          <button class="btn btn--gold btn--sm" onclick="showQR('${t.ticket_code}', '${qrUrl}', '${eventTitle.replace(/'/g, "\\'")}')">
            📱 Show QR
          </button>
          <a href="${qrUrl}" download="ticket-${t.ticket_code}.png" class="btn btn--outline btn--sm">
            ⬇ QR
          </a>` : ''}
          ${t.pdf_file ? `
          <a href="${t.pdf_file}" download class="btn btn--outline btn--sm">
            📄 PDF
          </a>` : ''}
          ${isValid && !isUsed ? `
          <button class="btn btn--outline btn--sm" onclick="openTransfer('${t.ticket_code}')">
            ↗ Transfer
          </button>` : ''}
        </div>
      </div>`;
    }).join('');

  } catch (e) {
    el.innerHTML = '<p style="color:var(--muted);text-align:center;padding:32px">Could not load tickets. Please refresh.</p>';
  }
}

function showQR(code, qrUrl, eventTitle) {
  document.getElementById('qr-modal-title').textContent = eventTitle || 'Your Ticket';
  document.getElementById('qr-modal-code').textContent = code;
  document.getElementById('qr-modal-img').src = qrUrl;
  const dl = document.getElementById('qr-modal-download');
  dl.href = qrUrl;
  dl.download = 'nexivo-ticket-' + code + '.png';
  Modal.open('qr-modal');
}

function openTransfer(code) {
  document.getElementById('transfer-ticket-code').value = code;
  document.getElementById('transfer-to-email').value = '';
  document.getElementById('transfer-message').value = '';
  Modal.open('transfer-modal');
}

async function submitTransfer() {
  const code = document.getElementById('transfer-ticket-code').value;
  const toEmail = document.getElementById('transfer-to-email').value.trim();
  if (!toEmail) { Toast.error('Enter a recipient email'); return; }
  try {
    await Api.post(`/tickets/${code}/transfer/`, {
      to_email: toEmail,
      message: document.getElementById('transfer-message').value
    });
    Toast.success('Ticket transfer sent!');
    Modal.close('transfer-modal');
  } catch(err) {
    Toast.error(err?.detail || 'Transfer failed.');
  }
}
</script>
{% endblock %}
