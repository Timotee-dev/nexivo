{% extends "base.html" %}
{% block title %}Payouts{% endblock %}
{% block content %}
<div class="dashboard">
  {% include "frontend/_host_sidebar.html" with active="payouts" %}
  <main class="dashboard__main">
    <h1 class="font-display" style="font-size:1.75rem;margin-bottom:8px">Payouts</h1>
    <p class="text-muted" style="margin-bottom:28px">Your earnings transferred to your bank account</p>
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th>Date</th><th>Gateway</th><th>Amount</th><th>Status</th><th>Payments Covered</th></tr></thead>
        <tbody id="payouts-tbody"><tr><td colspan="5" class="text-center"><div class="spinner" style="margin:24px auto"></div></td></tr></tbody>
      </table>
    </div>
  </main>
</div>
<script src="/static/js/dashboard.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  Auth.requireAuth();
  const tbody = document.getElementById('payouts-tbody');
  try {
    const data = await Api.get('/payouts/mine/');
    if (!data.results?.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted" style="padding:32px">No payouts yet. Payouts are released automatically after your events end.</td></tr>';
      return;
    }
    tbody.innerHTML = data.results.map(p => `
      <tr>
        <td>${new Date(p.scheduled_for).toLocaleDateString()}</td>
        <td><span style="text-transform:capitalize">${p.gateway}</span></td>
        <td class="fw-600">₦${Number(p.amount).toLocaleString()}</td>
        <td><span class="badge badge--${p.status === 'completed' ? 'green' : p.status === 'failed' ? 'red' : 'gold'}">${p.status}</span></td>
        <td>${p.payment_count} payment${p.payment_count !== 1 ? 's' : ''}</td>
      </tr>`).join('');
  } catch { Toast.error('Failed to load payouts.'); }
});
</script>
{% endblock %}
