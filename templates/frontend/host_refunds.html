{% extends "base.html" %}
{% block title %}Refund Requests{% endblock %}
{% block content %}
<div class="dashboard">
  {% include "frontend/_host_sidebar.html" with active="refunds" %}
  <main class="dashboard__main">
    <h1 class="font-display" style="font-size:1.75rem;margin-bottom:8px">Refund Requests</h1>
    <p class="text-muted" style="margin-bottom:28px">Pending refund requests from your customers</p>
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th>Customer</th><th>Event</th><th>Amount</th><th>Reason</th><th>Requested</th><th>Action</th></tr></thead>
        <tbody id="refunds-tbody"><tr><td colspan="6" class="text-center"><div class="spinner" style="margin:24px auto"></div></td></tr></tbody>
      </table>
    </div>
  </main>
</div>
<script src="/static/js/dashboard.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  Auth.requireAuth();
  const tbody = document.getElementById('refunds-tbody');

  async function load() {
    try {
      const data = await Api.get('/payments/refunds/pending/');
      if (!data.results?.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted" style="padding:32px">No pending refund requests.</td></tr>';
        return;
      }
      tbody.innerHTML = data.results.map(r => `
        <tr>
          <td>${r.requested_by || '—'}</td>
          <td style="font-size:.875rem">${r.payment}</td>
          <td class="fw-600">₦${Number(r.amount).toLocaleString()}</td>
          <td style="font-size:.875rem;max-width:200px">${r.reason}</td>
          <td style="font-size:.8125rem">${new Date(r.requested_at).toLocaleDateString()}</td>
          <td>
            <div class="flex gap-8">
              <button class="btn btn--gold btn--sm" onclick="decideRefund('${r.id}', true, this)">Approve</button>
              <button class="btn btn--outline btn--sm" style="border-color:var(--error);color:var(--error)" onclick="decideRefund('${r.id}', false, this)">Reject</button>
            </div>
          </td>
        </tr>`).join('');
    } catch { Toast.error('Failed to load refund requests.'); }
  }

  window.decideRefund = async (id, approve, btn) => {
    btn.disabled = true;
    try {
      await Api.post(`/payments/refunds/${id}/decide/`, { approve });
      Toast.success(approve ? 'Refund approved and processed.' : 'Refund rejected.');
      load();
    } catch(err) {
      Toast.error(err?.detail || 'Action failed.');
      btn.disabled = false;
    }
  };

  load();
});
</script>
{% endblock %}
