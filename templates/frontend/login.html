{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__logo">Nexiv<span>o</span></div>
    <h1 class="auth-card__title">Welcome back</h1>
    <p class="auth-card__sub">Sign in to your account to continue</p>

    <div id="google-signin-btn" style="width:100%;margin-bottom:10px"></div>
    <input type="hidden" id="google-client-id" value="{{ google_client_id }}">
    <button class="social-btn" style="display:none">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.79-.07-1.54-.19-2.27h-11.3v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12.255 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96h-3.98v3.09C3.515 21.3 7.615 24 12.255 24z"/><path fill="#FBBC05" d="M5.525 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62h-3.98a11.86 11.86 0 0 0 0 10.76l3.98-3.09z"/><path fill="#EA4335" d="M12.255 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C18.205 1.19 15.495 0 12.255 0c-4.64 0-8.74 2.7-10.71 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
      Continue with Google
    </button>
    <button class="social-btn" onclick="Toast.gold('Apple login — configure APPLE_OAUTH_CLIENT_ID in settings')">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.7 9.05 7.4c1.46.07 2.46.82 3.3.88 1.27-.24 2.46-1 3.83-.86 1.64.19 2.86.95 3.65 2.35-3.37 1.97-2.56 6.36.48 7.63-.52 1.42-1.23 2.8-3.26 4.88zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
      Continue with Apple
    </button>

    <div class="divider"><span>or</span></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="identifier">Email or Phone Number</label>
        <input class="form-input" type="text" id="identifier" name="identifier" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn--primary btn--full" type="submit">Sign In</button>
    </form>

    <p class="text-center text-muted mt-16" style="font-size:.875rem">
      Don't have an account? <a href="/auth/register/" class="text-gold fw-600">Create one</a>
    </p>
  </div>
</div>
<input type="hidden" id="captcha-site-key" value="{{ captcha_site_key }}">
<script src="/static/js/auth.js"></script>
{% endblock %}
