{% extends "base.html" %}
{% block title %}Browse Events{% endblock %}
{% block content %}
<div class="filter-bar">
  <div class="filter-bar__inner">
    <input type="text" id="search-input" class="form-input" placeholder="Search events…" style="max-width:280px;padding:7px 14px;font-size:.875rem">
    <span class="filter-chip filter-chip--active" data-type="">All Types</span>
    <span class="filter-chip" data-type="physical">In-Person</span>
    <span class="filter-chip" data-type="virtual">Virtual</span>
    <span class="filter-chip" data-type="hybrid">Hybrid</span>
  </div>
</div>
<div class="container">
  <div style="display:grid;grid-template-columns:220px 1fr;gap:36px;padding:40px 0">
    <!-- Sidebar filters -->
    <div>
      <div class="chart-card" style="padding:24px">
        <h3 class="fw-600" style="margin-bottom:16px">Categories</h3>
        <div id="cat-filter-list" style="display:flex;flex-direction:column;gap:6px">
          <label class="flex gap-8" style="cursor:pointer;font-size:.875rem"><input type="radio" name="cat" value=""> All</label>
        </div>
        <h3 class="fw-600" style="margin:24px 0 12px">Date Range</h3>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div class="form-group" style="margin:0"><label class="form-label" style="font-size:.75rem">From</label><input type="date" id="date-from" class="form-input"></div>
          <div class="form-group" style="margin:0"><label class="form-label" style="font-size:.75rem">To</label><input type="date" id="date-to" class="form-input"></div>
          <button class="btn btn--outline btn--sm" onclick="applyDateFilter()">Apply Filter</button>
        </div>
      </div>
    </div>

    <!-- Results -->
    <div>
      <div id="events-grid" class="grid-3"></div>
      <div id="events-empty" class="hidden" style="text-align:center;padding:56px 20px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:48px;height:48px;margin:0 auto 16px;display:block;opacity:.3"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <h3 style="font-weight:700;margin-bottom:6px">No events found</h3>
        <p class="text-muted">Try adjusting your filters or search terms</p>
      </div>
      <div class="flex gap-16 mt-24" id="pagination" style="justify-content:center"></div>
    </div>
  </div>
</div>
<script src="/static/js/events.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  // Populate category filter
  try {
    const cats = await Api.get('/events/categories/', true);
    const list = document.getElementById('cat-filter-list');
    cats.results.forEach(c => {
      const lbl = document.createElement('label');
      lbl.className = 'flex gap-8'; lbl.style.cursor = 'pointer'; lbl.style.fontSize = '.875rem';
      lbl.innerHTML = `<input type="radio" name="cat" value="${c.slug}" class="filter-chip" data-category="${c.slug}"> ${c.name}`;
      list.appendChild(lbl);
    });
  } catch {}
  function applyDateFilter() {
    const from = document.getElementById('date-from').value;
    const to = document.getElementById('date-to').value;
    const url = new URL(window.location.href);
    if (from) url.searchParams.set('start_after', from);
    if (to)   url.searchParams.set('start_before', to);
    window.location.href = url.toString();
  }
  window.applyDateFilter = applyDateFilter;
});
</script>
{% endblock %}
