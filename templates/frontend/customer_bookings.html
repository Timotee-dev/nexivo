{% extends "base.html" %}
{% block title %}My Bookings{% endblock %}
{% block content %}
<div class="dashboard">
  {% include "frontend/_customer_sidebar.html" with active="bookings" %}
  <main class="dashboard__main">
    <h1 class="font-display" style="font-size:1.75rem;margin-bottom:28px">My Bookings</h1>
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th>Reference</th><th>Event</th><th>Tickets</th><th>Total Paid</th><th>Status</th><th>Date</th><th></th></tr></thead>
        <tbody id="bookings-tbody"><tr><td colspan="7" class="text-center"><div class="spinner" style="margin:24px auto"></div></td></tr></tbody>
      </table>
    </div>
  </main>
</div>
<script src="/static/js/dashboard.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  Auth.requireAuth();
  const tbody = document.getElementById('bookings-tbody');
  try {
    const data = await Api.get('/bookings/mine/');
    if (!data.results?.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted" style="padding:32px">No bookings yet. <a href="/events/" class="text-gold">Browse events →</a></td></tr>';
      return;
    }
    tbody.innerHTML = data.results.map(b => `
      <tr>
        <td><code style="font-size:.8125rem">${b.booking_reference}</code></td>
        <td>${b.event?.title || '—'}</td>
        <td>${b.ticket_count}</td>
        <td class="fw-600">₦${Number(b.total_amount).toLocaleString()}</td>
        <td><span class="badge badge--${b.status === 'confirmed' ? 'green' : b.status === 'cancelled' ? 'red' : 'grey'}">${b.status}</span></td>
        <td style="font-size:.8125rem">${new Date(b.created_at).toLocaleDateString()}</td>
        <td>${b.status === 'confirmed'
          ? `<button class="btn btn--ghost btn--sm" onclick="requestRefund('${b.booking_reference}')">Request Refund</button>`
          : ''}</td>
      </tr>`).join('');
  } catch { Toast.error('Failed to load bookings.'); }
});

async function requestRefund(ref) {
  const reason = prompt('Please briefly describe your reason for requesting a refund:');
  if (!reason) return;
  try {
    const booking = await Api.get(`/bookings/${ref}/`);
    const payment = booking.payments?.[0];
    if (!payment) { Toast.error('No payment found for this booking.'); return; }
    await Api.post(`/payments/${payment.gateway_reference}/refund/`, { reason });
    Toast.success('Refund request submitted. The host will review it shortly.');
  } catch(err) { Toast.error(err?.detail || 'Failed to submit refund request.'); }
}
</script>
{% endblock %}
