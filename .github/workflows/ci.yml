name: Nexivo CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexivo_test
          POSTGRES_USER: nexivo
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "True"
      DATABASE_URL: postgres://nexivo:testpass@localhost:5432/nexivo_test
      REDIS_URL: redis://localhost:6379/0
      FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY || '' }}
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      PAYSTACK_SECRET_KEY: sk_test_fake
      FLUTTERWAVE_SECRET_KEY: fake
      STRIPE_SECRET_KEY: sk_test_fake
      STRIPE_WEBHOOK_SECRET: whsec_fake

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-prod.txt pytest pytest-django coverage

      - name: Generate encryption key if not set
        run: |
          if [ -z "$FIELD_ENCRYPTION_KEY" ]; then
            echo "FIELD_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> $GITHUB_ENV
          fi

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        run: |
          coverage run manage.py test tests --verbosity=2
          coverage report --min-coverage=60
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
        continue-on-error: true

  build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nexivo:ci --target runtime .

      - name: Verify image starts
        run: |
          docker run --rm -d \
            -e SECRET_KEY=ci-check \
            -e DEBUG=True \
            -e DATABASE_URL=sqlite:///tmp/ci.db \
            -e FIELD_ENCRYPTION_KEY=$(python3 -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())') \
            -p 8000:8000 \
            --name nexivo-ci nexivo:ci &
          sleep 10
          docker stop nexivo-ci || true
        continue-on-error: true
